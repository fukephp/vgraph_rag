[project]
name = "vgraph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "numpy",
    "sentence-transformers",
    "openai",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vgraph = "vgraph.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
